plugins { id 'com.android.application' }
android {
    namespace 'com.galaxy.batteryhook'
    compileSdk 35
    defaultConfig {
        applicationId 'com.galaxy.batteryhook'
        minSdk 28
        targetSdk 35
        versionCode 6
        versionName '0.6-live-monitor'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { compileOnly project(':xposed-api') }
