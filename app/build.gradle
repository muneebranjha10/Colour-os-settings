plugins { id 'com.android.application' }
android {
    namespace 'com.galaxy.batteryhook'
    compileSdk 35
    defaultConfig {
        applicationId 'com.galaxy.batteryhook'
        minSdk 28
        targetSdk 35
        versionCode 20
        versionName '1.1-rc10'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { compileOnly project(':xposed-api'); testImplementation 'junit:junit:4.13.2' }
