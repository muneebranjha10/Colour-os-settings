name: Build public release candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Require all thirty-two regression checks
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          files=glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          suites=[E.parse(f).getroot() for f in files]
          assert sum(int(s.get('tests',0)) for s in suites)>=32
          assert sum(int(s.get(k,0)) for s in suites for k in ('failures','errors','skipped'))==0
          print('Thirty-two or more regression checks passed')
          PY
      - name: Verify glass touch wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/galaxy/batteryhook')
          dashboard=(root/'Dashboard.java').read_text()
          protection=(root/'ProtectionCard.java').read_text()
          motion=(root/'MotionUi.java').read_text()
          for needle in ('tapGlass(tile,22,()->choose(index))','tapGlass(tile,22,()->selectChargingPolicy(mode))','tapGlass(t,15,()->openUsage(ix))','MotionUi.glassTouch(v,radius)'):
              assert needle in dashboard, needle
          for name in ('basic','max'):
              assert f'MotionUi.glassTouch({name},15)' in protection
              assert f'MotionUi.ripple({name})' not in protection
          assert 'null,new ColorDrawable(Color.WHITE)' not in motion
          assert 'null,rounded(v,14,Color.WHITE)' in motion
          assert 'state_focused,-android.R.attr.state_pressed' in motion
          print('Rounded touch feedback and glass selector wiring verified')
          PY
      - name: Verify in-window health navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/galaxy/batteryhook')
          health=(root/'HealthScreen.java').read_text()
          dashboard=(root/'Dashboard.java').read_text()
          hook=(root/'BatteryHook.java').read_text()
          assert 'host.addView(root' in health and 'host.removeView(root)' in health
          assert 'new Dialog(' not in health and 'parallax.accept' not in health
          assert 'unregisterOnBackInvokedCallback(backCallback)' in health
          assert 'handleHealthBack()' in dashboard and 'handleHealthBack()' in hook
          assert 'healthScreen==null&&isAttachedToWindow()' in dashboard
          print('Health page navigation wiring verified')
          PY
      - name: Verify refresh and settings wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/galaxy/batteryhook')
          d=(root/'Dashboard.java').read_text()
          h=(root/'HealthScreen.java').read_text()
          assert 'thermalNote=settingsItem(custom' in d and 'reminderNote=settingsItem(custom' in d
          assert 'settingsItem(parent,label,null' in d
          assert 'if(group.getChildCount()==0)return;' in d
          assert 'r.addView(new SettingsChevron()' in d
          assert 'refreshHandler.postDelayed(autoRead,quiet?60000:30000)' in h
          assert 'root.hasWindowFocus()' in h
          assert 'refreshHandler.removeCallbacks(autoRead)' in h
          assert 'token!=generation' in h
          print('Health refresh and aligned settings wiring verified')
          PY
      - name: Verify synchronized animation wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('app/src/main/java/com/galaxy/batteryhook')
          rail=(r/'GlassRail.java').read_text()
          dash=(r/'Dashboard.java').read_text()
          motion=(r/'MotionUi.java').read_text()
          assert 'setMotionListener(Dashboard.this::paintModePosition)' in dash
          assert 'setMotionListener(Dashboard.this::paintChargingPosition)' in dash
          assert 'setLocalMatrix' not in rail
          assert 'MotionUi.preparePanel(d,quietMode);d.show()' in dash
          assert 'static void panel(' not in motion
          print('Frame-linked labels, cached paint and single dialog transitions verified')
          PY
      - name: Verify APK and Xposed entry
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -p "$APK" assets/xposed_init | grep -Fx com.galaxy.batteryhook.BatteryHook
          cp "$APK" ColourOS-Battery-RC9.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "application-icon"
          sha256sum ColourOS-Battery-RC9.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyBattery-RC9-APK
          path: |
            ColourOS-Battery-RC9.apk
            SHA256SUMS.txt
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=rc9-${GITHUB_RUN_ID}
          gh release create "$TAG" ColourOS-Battery-RC9.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "ColourOS Battery v1.1 RC9 | Made by Muneeb" --notes-file docs/RELEASE-RC9.md --prerelease
