name: Build public release candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Require at least 44 regression checks
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          files=glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          suites=[E.parse(f).getroot() for f in files]
          assert sum(int(s.get('tests',0)) for s in suites)>=44
          assert sum(int(s.get(k,0)) for s in suites for k in ('failures','errors','skipped'))==0
          print('44 or more regression checks passed')
          PY
      - name: Verify glass touch wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/galaxy/batteryhook')
          dashboard=(root/'Dashboard.java').read_text()
          protection=(root/'ProtectionCard.java').read_text()
          motion=(root/'MotionUi.java').read_text()
          for needle in ('tapGlass(tile,22,()->choose(index))','tapGlass(tile,22,()->selectChargingPolicy(mode))','tapGlass(t,15,()->openUsage(ix))','MotionUi.glassTouch(v,radius)'):
              assert needle in dashboard, needle
          for name in ('basic','max'):
              assert f'MotionUi.glassTouch({name},15)' in protection
              assert f'MotionUi.ripple({name})' not in protection
          assert 'null,new ColorDrawable(Color.WHITE)' not in motion
          assert 'null,rounded(v,14,Color.WHITE)' in motion
          assert 'state_focused,-android.R.attr.state_pressed' in motion
          print('Rounded touch feedback and glass selector wiring verified')
          PY
      - name: Verify in-window health navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/galaxy/batteryhook')
          health=(root/'HealthScreen.java').read_text()
          dashboard=(root/'Dashboard.java').read_text()
          hook=(root/'BatteryHook.java').read_text()
          assert 'host.addView(root' in health and 'host.removeView(root)' in health
          assert 'new Dialog(' not in health and 'parallax.accept' not in health
          assert 'unregisterOnBackInvokedCallback(backCallback)' in health
          assert 'handleHealthBack()' in dashboard and 'handleHealthBack()' in hook
          assert 'healthScreen==null&&isAttachedToWindow()' in dashboard
          print('Health page navigation wiring verified')
          PY
      - name: Verify refresh and settings wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/galaxy/batteryhook')
          d=(root/'Dashboard.java').read_text()
          h=(root/'HealthScreen.java').read_text()
          assert 'thermalNote=settingsItem(custom' in d and 'reminderNote=settingsItem(custom' in d
          assert 'settingsItem(parent,label,null' in d
          assert 'if(group.getChildCount()==0)return;' in d
          assert 'r.addView(new SettingsChevron()' in d
          assert 'refreshHandler.postDelayed(autoRead,quiet?60000:30000)' in h
          assert 'root.hasWindowFocus()' in h
          assert 'refreshHandler.removeCallbacks(autoRead)' in h
          assert 'token!=generation' in h
          print('Health refresh and aligned settings wiring verified')
          PY
      - name: Verify power mode fallbacks and yellow bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/galaxy/batteryhook')
          dash=(root/'Dashboard.java').read_text()
          native=(root/'NativeModes.java').read_text()
          glass=(root/'GlassRail.java').read_text()
          assert 'bar.setLevel(percent,plugged,engine.isSaving())' in dash
          assert 'oldColor=ColorOsPalette.mix(oldColor,newColor,colorMix)' in (root/'LiquidBatteryBar.java').read_text()
          assert 'lens.setPowerSavingTint(saving)' in dash
          assert 'canProbeLightProfile' in native
          assert 'Profile not confirmed' in native
          assert 'if((mode==0||mode==2)&&!engine.supportsLight())' in dash
          assert 'setPowerSavingTint(boolean enabled)' in glass
          print('Verified state-aware saver yellow and native performance fallback')
          PY
      - name: Verify corrected Balanced, Light and submenus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/galaxy/batteryhook')
          dash=(p/'Dashboard.java').read_text()
          native=(p/'NativeModes.java').read_text()
          rules=(p/'ReleaseRules.java').read_text()
          assert 'Balanced: Samsung Light · Performance: Samsung Standard' not in dash
          assert 'modeExplanation=' not in dash
          assert 'Power profiles' in dash and 'Charging controls' in dash
          assert 'powerProfilesMenu()' in dash and 'chargingControlsMenu()' in dash
          assert 'chooseLight()' in dash and 'selectChargingPolicy(1)' in dash
          assert 'modeNotes[j].setText(values[j])' in dash
          assert 'int normalMode(){return profile()==1?0:2;}' in native
          assert 'return ReleaseRules.modeForSamsungProfile(profile());' in native
          assert 'applyProfile(ReleaseRules.samsungProfileForStandard())' in native
          assert 'applyProfile(ReleaseRules.samsungProfileForLight())' in native
          assert 'static int samsungProfileForStandard(){return 0;}' in rules
          assert 'static int samsungProfileForLight(){return 1;}' in rules
          assert 'int confirmed=engine.activeMode()' in dash
          print('Balanced uses Light, Performance uses Standard; profile switching has readback')
          PY
      - name: Verify directly selectable performance and charging rails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/galaxy/batteryhook')
          dash=(root/'Dashboard.java').read_text()
          native=(root/'NativeModes.java').read_text()
          rules=(root/'ReleaseRules.java').read_text()
          assert 'String[] captions={"Balanced\\nmode","Power saving\\nmode","Performance\\nmode"};' in dash
          assert 'section(body,"Performance profile");addPerformanceProfiles(body)' in dash
          assert 'new ProfileTouchHost()' in dash
          assert 'profileRail=new GlassRail' in dash
          assert 'profileRail.setMotionListener(this::paintProfilePosition)' in dash
          assert 'tapGlass(tile,22,()->choose(index==0?0:2))' in dash
          assert 'if(profileRail!=null&&!profileDragging&&!busy)profileRail.settle(position)' in dash
          assert 'else if(mode==2){' in native and 'applyProfile(ReleaseRules.samsungProfileForStandard())' in native
          assert 'applyProfile(ReleaseRules.samsungProfileForLight())' in native
          assert 'if(profile()!=value)throw new IllegalStateException("Profile not confirmed")' in native
          assert 'static int modeForSamsungProfile(int profile)' in rules
          print('Direct Light/Standard controls with animated rail, fallback and verified readback')
          PY
      - name: Verify battery bar effects and watt confidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/galaxy/batteryhook')
          bar=(root/'LiquidBatteryBar.java').read_text()
          dash=(root/'Dashboard.java').read_text()
          telemetry=(root/'ChargeTelemetry.java').read_text()
          rules=(root/'ReleaseRules.java').read_text()
          assert 'void configure(int style,boolean glint,boolean flow)' in bar
          assert 'postDelayed(frame,45)' not in bar and 'onDetachedFromWindow(){stopAnimations()' in bar
          assert 'Battery bar studio' in dash and 'Battery tools' in dash and 'Wattage accuracy' in dash
          assert 'bar.setLevel(percent,plugged,engine.isSaving())' in dash
          assert 'publishPower(smooth,r.charging,r.full,r.uncertain)' in telemetry
          assert 'static boolean publishPower(' in rules
          print('Gauge lifecycle, submenus and reliable watts verified')
          PY
      - name: Verify reference bar and self-imported OPPO Sans font
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/galaxy/batteryhook')
          bar=(root/'LiquidBatteryBar.java').read_text()
          dash=(root/'Dashboard.java').read_text()
          fonts=(root/'FontStore.java').read_text()
          hook=(root/'BatteryHook.java').read_text()
          assert 'ColorOS reference' in dash
          assert 'fontOptions()' in dash
          assert 'FontStore.get(a)' in dash
          assert 'ACTION_OPEN_DOCUMENT' in dash
          assert 'installFontPickerHook' in hook
          assert 'REQUEST=8143' in fonts
          assert 'importFromDocument(Context c,Uri uri)' in fonts
          assert '32 MB' in fonts
          assert 'getWindowVisibility()' not in bar
          assert 'onWindowFocusChanged(boolean focus)' in bar
          assert 'oldColor=newColor;colorMix=1f;sweep=1f' in bar
          assert 'new LinearGradient(' in bar
          assert 'SystemClock' not in bar
          print('Verified clean reference bar, no permanent animation, and local-only font import')
          PY
      - name: Verify ColorOS-responsive animation geometry and scheduling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/galaxy/batteryhook')
          rail=(root/'GlassRail.java').read_text()
          math=(root/'GlassMath.java').read_text()
          timing=(root/'PageMotion.java').read_text()
          native=(root/'NativeModes.java').read_text()
          dash=(root/'Dashboard.java').read_text()
          assert 'anim.setDuration(Math.min(350' in rail
          assert 'Math.abs(next-startSlot)>1.1f?245:195' in rail
          assert 'float x=xAt(slot),tileWidth=widthAt(slot)' in rail
          assert 'Math.min(dp(8),Math.abs(lag)*tileWidth*.18f)' in rail
          assert '!dragging&&(anim==null||!anim.isRunning())' in rail
          assert 'Math.exp(-Math.max(0,elapsedMs)/22f)' in math
          assert 'style==0?.76f:style==2?1.28f:1f' in timing
          assert 'main.postDelayed(()->{if(!closed)result.run();},350)' not in native
          assert 'main.post(()->{if(!closed)result.run();});' in native
          assert 'Fast · responsive' in dash
          print('Short touch response, limited stretch, fast profile confirmation and no moving-shader load')
          PY
      - name: Verify synchronized animation wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('app/src/main/java/com/galaxy/batteryhook')
          rail=(r/'GlassRail.java').read_text()
          dash=(r/'Dashboard.java').read_text()
          motion=(r/'MotionUi.java').read_text()
          assert 'setMotionListener(Dashboard.this::paintModePosition)' in dash
          assert 'setMotionListener(Dashboard.this::paintChargingPosition)' in dash
          assert 'setLocalMatrix' not in rail
          assert 'MotionUi.preparePanel(d,quietMode);d.show()' in dash
          assert 'static void panel(' not in motion
          print('Frame-linked labels, cached paint and single dialog transitions verified')
          PY
      - name: Verify bounded optical renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('app/src/main/java/com/galaxy/batteryhook')
          rail=(r/'GlassRail.java').read_text()
          optics=(r/'LensOptics.java').read_text()
          assert 'canvas.isHardwareAccelerated()' in rail and 'SDK_INT>=33' in rail
          assert 'if(!optical)' in rail and 'removeCallbacks(dragFrame)' in rail
          assert 'postOnAnimation(dragFrame)' in rail and 'if(!dragging||!isAttachedToWindow())return' in rail
          assert 'tileSurface(p+bend)-tileSurface(p)' in optics
          assert 'Bitmap' not in optics and 'Bitmap' not in rail
          print('Optical fallback and lifecycle wiring verified')
          PY
      - name: Verify APK and Xposed entry
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -p "$APK" assets/xposed_init | grep -Fx com.galaxy.batteryhook.BatteryHook
          cp "$APK" ColourOS-Battery-RC16.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "application-icon"
          sha256sum ColourOS-Battery-RC16.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyBattery-RC16-APK
          path: |
            ColourOS-Battery-RC16.apk
            SHA256SUMS.txt
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=rc16-${GITHUB_RUN_ID}
          gh release create "$TAG" ColourOS-Battery-RC16.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "ColourOS Battery v1.1 RC16 | Made by Muneeb" --notes-file docs/RELEASE-RC16.md --prerelease
