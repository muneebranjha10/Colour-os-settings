name: Build public release candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Require all sixteen regression checks
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as E
          files=glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          suites=[E.parse(f).getroot() for f in files]
          assert sum(int(s.get('tests',0)) for s in suites)>=16
          assert sum(int(s.get(k,0)) for s in suites for k in ('failures','errors','skipped'))==0
          print('Sixteen or more regression checks passed')
          PY
      - name: Verify APK and Xposed entry
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -p "$APK" assets/xposed_init | grep -Fx com.galaxy.batteryhook.BatteryHook
          cp "$APK" ColourOS-Battery-RC4.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "application-icon"
          sha256sum ColourOS-Battery-RC4.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyBattery-RC4-APK
          path: |
            ColourOS-Battery-RC4.apk
            SHA256SUMS.txt
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=rc4-${GITHUB_RUN_ID}
          gh release create "$TAG" ColourOS-Battery-RC4.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "ColourOS Battery v1.1 RC4 | Made by Muneeb" --notes-file docs/RELEASE-RC4.md --prerelease
