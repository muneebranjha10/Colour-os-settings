name: Build stage 5 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK and Xposed entry
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -p "$APK" assets/xposed_init | grep -Fx com.galaxy.batteryhook.BatteryHook
          cp "$APK" ColourOS-Battery-Stage5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyBattery-Stage5-APK
          path: ColourOS-Battery-Stage5.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=stage5-${GITHUB_RUN_ID}
          gh release create "$TAG" ColourOS-Battery-Stage5.apk --target "$GITHUB_SHA" --title "Stage 5 integration test" --notes "Live battery-side watts, optical lens renderer, charging color transition. Scope Device Care only." --prerelease
